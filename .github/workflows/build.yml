name: Build

# Builds both exes with the same csc.exe (C# 5, .NET Framework) that build.ps1 uses on the
# work laptop, runs the tests, and on main refreshes the committed exes + zip so the
# download in the repo always matches the source.
on:
  push:
    branches: [main]
    paths-ignore: ['*.exe', '*.zip']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Outlook interop from NuGet (the runner has no Office)
        shell: pwsh
        run: |
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/microsoft.office.interop.outlook/15.0.4797.1004/microsoft.office.interop.outlook.15.0.4797.1004.nupkg -OutFile interop.zip
          Expand-Archive interop.zip -DestinationPath interop
          "OUTLOOK_INTEROP=$PWD\interop\lib\net20\Microsoft.Office.Interop.Outlook.dll" >> $env:GITHUB_ENV

      - name: Build (build.ps1)
        shell: pwsh
        run: .\build.ps1

      - name: AskDetector tests
        shell: pwsh
        run: |
          $csc = Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $csc /nologo /out:AskDetectorTests.exe tests\AskDetectorTests.cs AskDetector.cs
          if ($LASTEXITCODE -ne 0) { throw "test build failed" }
          .\AskDetectorTests.exe
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path OutlookListener.exe, RulesDashboard.exe -DestinationPath OutlookListener.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: OutlookListener
          path: |
            OutlookListener.exe
            RulesDashboard.exe

      - name: Commit refreshed exes (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OutlookListener.exe RulesDashboard.exe OutlookListener.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Rebuild exes and zip from source"
            git push
          }
